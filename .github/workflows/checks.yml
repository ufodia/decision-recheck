name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DRC_BROWSER_CHANNEL: ${{ matrix.os == 'windows-latest' && 'chrome' || 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --locked
      - name: Install Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps --no-shell chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: uv run playwright install --no-shell chromium
      - run: uv run python scripts/export_demo.py
      - run: uv run python scripts/check.py --junitxml=test-results/junit.xml
      - run: uv build
