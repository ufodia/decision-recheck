<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Decision Recheck — Test the promise. Recheck the decision.</title><desc id="desc">An open-source SaaS audit pack connecting observed evidence to product, buyer and marketing decisions.</desc>
<rect width="1280" height="640" fill="#f6f3e9"/><path d="M60 90h1160M60 573h1160" stroke="#c4cebb"/>
<g transform="translate(60 35)"><rect width="36" height="36" fill="#153e34"/><path d="M10 9h9c6 0 9 4 9 9s-3 9-9 9h-9V9Z" fill="none" stroke="#d8ef9a" stroke-width="1.5"/><path d="m13 19 4 4 9-10" fill="none" stroke="#f6f3e9" stroke-width="2"/><text x="50" y="24" font-family="Arial,sans-serif" font-size="18" fill="#153e34">Decision Recheck</text></g>
<text x="1220" y="59" text-anchor="end" fill="#56675d" font-family="Consolas,monospace" font-size="12" letter-spacing="2">OPEN SOURCE / BY UFODIA</text>
<text x="60" y="151" fill="#56675d" font-family="Consolas,monospace" font-size="12" letter-spacing="2">SOFTWARE PROMISES. OBSERVED EVIDENCE.</text>
<text x="56" y="252" fill="#153e34" font-family="Georgia,serif" font-size="78" letter-spacing="-3">Test the promise.</text>
<text x="56" y="337" fill="#153e34" font-family="Georgia,serif" font-size="78" letter-spacing="-3" font-style="italic">Recheck</text><text x="361" y="337" fill="#153e34" font-family="Georgia,serif" font-size="78" letter-spacing="-3">the decision.</text>
<text x="60" y="405" fill="#56675d" font-family="Arial,sans-serif" font-size="21">One evidence trail. Three useful perspectives.</text>
<text x="60" y="461" fill="#153e34" font-family="Consolas,monospace" font-size="13">LOCAL RUNNER  /  THREE REPORT VIEWS  /  MODEL-FREE DEMO</text>
<g transform="translate(880 155)"><rect width="340" height="335" fill="#e7ebdf" stroke="#c4cebb"/><path d="M20 30h300M20 62h300M20 94h300M20 126h300M20 158h300M20 190h300M20 222h300M20 254h300M20 286h300" stroke="#d1dac7"/><rect x="25" y="28" width="278" height="104" fill="#fcfaf4" stroke="#c4cebb"/><text x="42" y="53" fill="#56675d" font-family="Consolas,monospace" font-size="9" letter-spacing="1">AN OFFER CHANGED</text><text x="42" y="99" fill="#153e34" font-family="Georgia,serif" font-size="34">$9 → $49 /mo</text><path d="M164 133v28" stroke="#153e34"/><path d="m160 155 4 6 4-6" fill="none" stroke="#153e34"/><rect x="40" y="166" width="277" height="140" fill="#153e34"/><text x="57" y="194" fill="#d8ef9a" font-family="Consolas,monospace" font-size="9" letter-spacing="1">DECISIONS TO REVISIT</text><text x="57" y="224" fill="#f6f3e9" font-family="Arial,sans-serif" font-size="14">Product / reproduce the gate</text><text x="57" y="252" fill="#f6f3e9" font-family="Arial,sans-serif" font-size="14">Buyer / reassess the budget</text><text x="57" y="280" fill="#f6f3e9" font-family="Arial,sans-serif" font-size="14">Campaign / correct the promise</text></g>
